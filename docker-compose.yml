# Wikipedia edit streaming pipeline.
#
#   producer  ->  redpanda (Kafka)  ->  spark  ->  DuckDB + Parquet
#                                                ->  dashboard
#
# DuckDB file, Parquet lake and Spark checkpoints live on the shared
# `stream-data` volume, mounted at /data in the spark and dashboard
# containers.
#
# Ports:
#   8501   Streamlit dashboard        http://localhost:8501
#   8080   Redpanda Console           http://localhost:8080
#   19092  Kafka API (external listener, for local tools/tests)
#   18081  Schema Registry, 18082 Pandaproxy

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  console:
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    environment:
      KAFKA_BROKER: redpanda:9092
      KAFKA_TOPIC: wikipedia.edits
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  spark:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    environment:
      KAFKA_BROKER: redpanda:9092
      KAFKA_TOPIC: wikipedia.edits
      DUCKDB_PATH: /data/duckdb/wikipedia.duckdb
      PARQUET_PATH: /data/parquet
      CHECKPOINT_PATH: /data/checkpoints
    volumes:
      - stream-data:/data
    depends_on:
      redpanda:
        condition: service_healthy
    # The Kafka connector is not bundled with Spark; fetch the version
    # matching the Spark 3.5.1 image at submit time.
    command: >
      /opt/spark/bin/spark-submit
      --master local[*]
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
      /app/streaming/streaming_job.py
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment:
      DUCKDB_PATH: /data/duckdb/wikipedia.duckdb
      REFRESH_SECONDS: "15"
    ports:
      - "8501:8501"
    volumes:
      - stream-data:/data
    depends_on:
      - spark
    restart: unless-stopped

volumes:
  stream-data:
